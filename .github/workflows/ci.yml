# CI only: lint, test, build, preview artifact. No deploy job here (added by the owner only after "deploy online").
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML sanity
        run: |
          test -f src/index.html
          grep -q "<title>" src/index.html
      - name: Preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: src
